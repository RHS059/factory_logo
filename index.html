<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#233e53">
  <meta name="description" content="A living painted meadow. A fixed view through wind-stirred grass toward slowly drifting clouds.">
  <title>Factory — Living Meadow</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="Factory — Living Meadow">
  <meta property="og:description" content="A living painted landscape with a chrome Factory logo, wind-stirred grass, and day and night views.">
  <meta property="og:url" content="https://rhs059.github.io/factory_logo/">
  <meta property="og:image" content="https://rhs059.github.io/factory_logo/assets/site-preview.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:alt" content="Chrome Factory logo in a painted meadow beneath sunset clouds, with company information below.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Factory — Living Meadow">
  <meta name="twitter:description" content="A living painted landscape with a chrome Factory logo and day and night views.">
  <meta name="twitter:image" content="https://rhs059.github.io/factory_logo/assets/site-preview.png">
  <meta name="twitter:image:alt" content="Chrome Factory logo in a painted meadow beneath sunset clouds, with company information below.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css?v=8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
</head>
<body>
  <main id="landscape" aria-label="Painted meadow with slowly drifting clouds and grass moving in the wind">
    <p id="status" role="status" hidden>Opening the meadow…</p>
  </main>
  <section class="factory-hud" aria-label="Factory fundraising">
    <div class="factory-brand">
      <p class="hud-label">BLACKSTONE</p>
      <h1>FACTORY</h1>
    </div>
    <dl class="factory-metrics">
      <div>
        <dt class="hud-label">FUNDRAISED</dt>
        <dd>$200M</dd>
      </div>
      <div>
        <dt class="hud-label">VALUATION</dt>
        <dd>$5B</dd>
      </div>
    </dl>
  </section>
  <button id="theme-toggle" type="button" aria-label="Switch to night" title="Switch to night" aria-pressed="false" disabled>
    <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 14.4A8.8 8.8 0 0 1 9.6 3.6a8.8 8.8 0 1 0 10.8 10.8Z"/></svg>
    <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <aside id="debug" hidden>
    <strong>Scene study</strong>
    <label><input id="motion" type="checkbox" checked> Animate</label>
    <label><input id="clouds" type="checkbox" checked> Clouds</label>
    <label><input id="grass" type="checkbox" checked> Grass layers</label>
    <label>Depth check <input id="offset" type="range" min="-2" max="2" step="0.05" value="0"></label>
    <output id="stats"></output>
  </aside>
  <noscript>This landscape needs JavaScript. <img src="./assets/source.png" alt="Painted grassy plain beneath towering golden and blue clouds"></noscript>
  <script type="module" src="./scene.js?v=8"></script>
</body>
</html>
